backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to main)

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "projects"
    label: "Mechatronics Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Short Description", name: "description", widget: "text"}
      - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Thumbnail Image", name: "image", widget: "image", required: false}
      - {label: "Skills / Technologies", name: "skills", widget: "list"}
      
      - label: "Project Report / Main Content"
        name: "body"
        widget: "markdown"
        
      - label: "Bill of Materials (BOM)"
        name: "bom"
        widget: "markdown"
        required: false
        
      - label: "Appendix / Extra Resources"
        name: "appendix"
        widget: "markdown"
        required: false
        
      - label: "Readme / Setup Instructions"
        name: "readme"
        widget: "markdown"
        required: false

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Home Page Text"
        name: "home_details"
        file: "src/data/home.json"
        format: "json"
        fields:
          - {label: "Main Title", name: "title", widget: "string"}
          - {label: "Subtitle / Description", name: "subtitle", widget: "text"}

  - name: "hobbies"
    label: "Interests & Hobbies"
    folder: "src/content/hobbies"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list"}
      - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "cv"
    label: "CV Configuration"
    files:
      - label: "CV Details"
        name: "cv_details"
        file: "src/data/cv.json"
        format: "json"
        fields:
          - {label: "Full Name", name: "name", widget: "string"}
          - {label: "Professional Title", name: "title", widget: "string"}
          - {label: "Subtitle / Objective", name: "subtitle", widget: "string"}
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Email", name: "email", widget: "string"}
              - {label: "GitHub", name: "github", widget: "string"}
              - {label: "LinkedIn", name: "linkedin", widget: "string"}
          - label: "Education"
            name: "education"
            widget: "list"
            fields:
              - {label: "Degree", name: "degree", widget: "string"}
              - {label: "Duration", name: "duration", widget: "string"}
              - {label: "Institution", name: "institution", widget: "string"}
          - label: "Experience"
            name: "experience"
            widget: "list"
            fields:
              - {label: "Role", name: "role", widget: "string"}
              - {label: "Company", name: "company", widget: "string"}
              - {label: "Duration", name: "duration", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
